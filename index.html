<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c4244d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c4244d'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='19' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<title>Base Operativa · Collab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar de módulos + área de trabajo; cajón lateral para editar registros */
:root{
  --bg:#f4f4f7; --surface:#ffffff; --sunk:#ececf1; --ink:#18181f; --muted:#666676; --line:#dfdfe7;
  --accent:#c4244d; --accent-ink:#ffffff; --accent-soft:#fbe6ec;
  --ok:#1d7d55; --ok-soft:#e1f3ea; --warn:#a86b12; --warn-soft:#fbefd9; --bad:#c22f2f; --bad-soft:#fbe3e3; --info:#2c58c4; --info-soft:#e4ebfb;
  --avL:86%; --avT:28%;
  --shadow:0 1px 2px rgba(20,20,40,.06),0 8px 24px rgba(20,20,40,.08);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111116; --surface:#1a1a21; --sunk:#14141a; --ink:#ececf2; --muted:#9b9bab; --line:#2b2b35;
  --accent:#ff5a82; --accent-ink:#1a0a10; --accent-soft:#3a1a25;
  --ok:#4cc58d; --ok-soft:#173327; --warn:#e5a948; --warn-soft:#3a2c14; --bad:#ff6b6b; --bad-soft:#3d1c1c; --info:#7ea2ff; --info-soft:#1c2645;
  --avL:30%; --avT:88%; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111116; --surface:#1a1a21; --sunk:#14141a; --ink:#ececf2; --muted:#9b9bab; --line:#2b2b35;
  --accent:#ff5a82; --accent-ink:#1a0a10; --accent-soft:#3a1a25;
  --ok:#4cc58d; --ok-soft:#173327; --warn:#e5a948; --warn-soft:#3a2c14; --bad:#ff6b6b; --bad-soft:#3d1c1c; --info:#7ea2ff; --info-soft:#1c2645;
  --avL:30%; --avT:88%; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:22px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:21px;letter-spacing:-.01em;line-height:1}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-weight:500;color:var(--muted)}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:17px;height:17px;flex:none}
.nav .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--sunk);color:var(--muted);border-radius:20px;padding:1px 7px}
.nav .ct.bad{background:var(--bad-soft);color:var(--bad)}
.road{padding:0 8px;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.road ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.road li{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.road li span{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;height:18px;line-height:16px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
/* main */
main{min-width:0;padding-block:24px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:20px}
.head h1{font-family:var(--f-display);font-size:30px;line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
.head .grow{flex:1;min-width:200px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea.in{resize:vertical;line-height:1.5}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tools .in{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--sunk);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>h3,.sec-h{font-family:var(--f-display);font-size:16px;margin:0;letter-spacing:-.01em}
.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;background:hsl(var(--h,250) 70% var(--avL));color:hsl(var(--h,250) 45% var(--avT));max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;background:hsl(var(--h,250) 60% var(--avL));color:hsl(var(--h,250) 50% var(--avT));letter-spacing:.02em}
.av.none{background:var(--sunk);color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.due{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.due.bad{color:var(--bad);font-weight:500} .due.warn{color:var(--warn);font-weight:500}
.pri-m{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.pri-alta{background:var(--bad)} .pri-media{background:var(--warn)} .pri-baja{background:var(--line)}
.st{font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap}
.st-pendiente{background:var(--sunk);color:var(--muted)} .st-en_curso{background:var(--info-soft);color:var(--info)} .st-revision{background:var(--warn-soft);color:var(--warn)} .st-hecha{background:var(--ok-soft);color:var(--ok)}
/* inicio */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--muted)}
.kpi .n{font-family:var(--f-display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .t{font-size:13px;color:var(--muted);font-weight:500}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load{padding:6px 16px 14px;display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.lrow .nm{display:flex;gap:7px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--info)} .bar i.b{background:var(--bad)}
/* reuniones */
.split{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}
.mlist{max-height:calc(100vh - 170px);overflow:auto}
.mitem{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.mitem:first-child{border-top:0}
.mitem:hover{background:var(--sunk)}
.mitem.on{background:var(--accent-soft)}
.cal{flex:none;width:42px;text-align:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);align-self:flex-start}
.cal b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.2}
.cal small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);color:var(--muted);padding:1px 0;font-weight:600}
.mitem .main{min-width:0;flex:1}
.prog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.prog .bar{width:60px;height:5px}
.prog .bar i{background:var(--ok)}
.mdet{padding:18px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ttl-in{border:0;background:transparent;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.015em;width:100%;padding:2px 0;border-bottom:1px dashed transparent}
.ttl-in:hover{border-bottom-color:var(--line)} .ttl-in:focus{outline:none;border-bottom-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 4px;font-size:13px;color:var(--muted)}
.pick button.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.pick button:focus-visible{outline:2px solid var(--accent)}
.pick .av{width:20px;height:20px;font-size:9px}
.links{display:flex;flex-direction:column;gap:6px}
.link{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:0;background:var(--surface)}
.link a{color:var(--info);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.link a:hover{text-decoration:underline}
.link .kind{font-size:10px;font-family:var(--f-mono);text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:none}
.link .x{all:unset;cursor:pointer;color:var(--muted);padding:0 4px;font-size:16px;line-height:1}
.link .x:hover{color:var(--bad)}
.addlink{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto auto;gap:6px}
.qa{display:grid;grid-template-columns:minmax(0,1fr) 120px 140px 136px 90px auto;gap:6px;padding:10px;background:var(--sunk);border-radius:8px}
.mtasks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mtask{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);min-width:0;background:var(--surface)}
.mtask:first-child{border-top:0}
.mtask .main{flex:1;min-width:0;cursor:pointer}
.mtask .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtask.done .ttl{text-decoration:line-through;color:var(--muted)}
.ck{all:unset;cursor:pointer;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;flex:none}
.ck.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ck svg{width:12px;height:12px}
.ck:focus-visible{outline:2px solid var(--accent)}
.sugg{border:1px dashed var(--accent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px 140px 136px 90px;gap:6px;align-items:center}
.secrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* tareas */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;border:1px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col h4{margin:0 2px 2px;display:flex;align-items:center;gap:8px;font-size:13px}
.col h4 .mono{color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card.dragging{opacity:.4}
.card .ttl{font-weight:600;line-height:1.3}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .meta .sp{flex:1}
.card .ic{font-size:11px;color:var(--muted);display:inline-flex;gap:3px;align-items:center}
.card .ic svg{width:12px;height:12px}
.tlist .row{cursor:pointer}
.tlist .cell{flex:none;width:140px;min-width:0}
.tlist .hdr{display:flex;gap:10px;padding:8px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
/* clientes/equipo */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.ccard:hover{border-color:var(--muted)}
.ccard h3{margin:0;font-family:var(--f-display);font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.ccard .sw{width:12px;height:12px;border-radius:3px;background:hsl(var(--h) 65% 55%);flex:none}
.ccard .sub{color:var(--muted);font-size:13px;min-height:19px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.stats b{font-family:var(--f-mono);font-size:14px;color:var(--ink);font-weight:500;margin-right:3px}
.stats b.bad{color:var(--bad)}
.tag{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.tag.on{background:var(--ok-soft);color:var(--ok)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh .lbl{flex:1}
.db{overflow:auto;padding:16px 20px 30px;display:flex;flex-direction:column;gap:16px}
.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.log{display:flex;flex-direction:column;gap:8px}
.log .it{border-left:2px solid var(--line);padding:2px 0 2px 10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.log .it small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-weight:500}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;box-shadow:var(--shadow);font-size:13px}
.toast.bad{background:var(--bad);color:#fff}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.ro [data-w]{display:none!important}
.ptag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.xtag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}
.xtag.bon{color:var(--muted);background:var(--sunk)}
.xbox{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.xbox p{margin:0;font-weight:500}
.scope{overflow-x:auto}
.scope table{border-collapse:collapse;width:100%;min-width:820px}
.scope th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.scope td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.scope tr.cl{cursor:pointer} .scope tr.cl:hover td{background:var(--sunk)} .scope tr.cl.on td{background:var(--accent-soft)}
.scope td.nm{font-weight:600;white-space:nowrap}
.scope .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.meter{display:flex;flex-direction:column;gap:4px;min-width:64px}
.meter .v{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.meter .v.warn{color:var(--warn);font-weight:500} .meter .v.over{color:var(--accent);font-weight:700}
.meter .bar{height:5px} .meter .bar i{background:var(--ok)} .meter .bar i.warn{background:var(--warn)} .meter .bar i.over{background:var(--accent)}
.na{color:var(--muted);opacity:.5}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.month{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

const rid=()=>{const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let s='';const r=crypto.getRandomValues(new Uint8Array(20));r.forEach(x=>s+=a[x%62]);return s};
const err=(e,fallback)=>{const x=new Error((e&&e.message)||fallback||'error');const c=e&&e.code;x.code=c==='42501'||/row-level security/i.test(x.message)?'permission_denied':/JWT|expired/i.test(x.message)?'revoked':c||'unknown';return x};
function snapOf(coll,filter){
  const m=cache[coll]||new Map();const docs=[];
  m.forEach((d,id)=>{if(!filter||filter(d))docs.push({id,data:()=>d})});
  return {docs,size:docs.length,empty:!docs.length};
}
function emit(coll){
  if(emitT[coll])return;
  emitT[coll]=setTimeout(()=>{emitT[coll]=null;(subs[coll]||[]).forEach(s=>{try{s.cb(snapOf(coll,s.filter))}catch(e){console.error(e)}})},30);
}
async function fetchColl(coll,srv){
  const out=new Map();let from=0;const N=1000;
  for(;;){
    let q=sb.from('docs').select('id,data').eq('coll',coll).range(from,from+N-1);
    if(srv)q=srv(q);
    const {data,error}=await q;if(error)throw err(error);
    data.forEach(r=>out.set(r.id,r.data||{}));
    if(data.length<N)break;from+=N;
  }
  return out;
}
async function load(coll,srv){
  const m=await fetchColl(coll,srv);
  cache[coll]=m;loaded[coll]=srv||true;emit(coll);
}
async function reloadAll(){
  for(const c of Object.keys(loaded)){try{await load(c,loaded[c]===true?null:loaded[c])}catch(e){}}
}
let chan=null,wasDown=false,hiddenAt=0;
function realtime(){
  if(chan)return;
  chan=sb.channel('bo-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.coll||!cache[r.coll])return;
    if(p.eventType==='DELETE')cache[r.coll].delete(r.id);else cache[r.coll].set(r.id,r.data||{});
    emit(r.coll);
  }).subscribe(st=>{
    if(st==='SUBSCRIBED'){if(wasDown){wasDown=false;reloadAll()}}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){wasDown=true}
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)hiddenAt=Date.now();
    else if(hiddenAt&&Date.now()-hiddenAt>3*60e3){hiddenAt=0;reloadAll()}
  });
}
function docRef(coll,id){
  return {
    id,path:coll+'/'+id,
    async get(){const {data,error}=await sb.from('docs').select('data').eq('coll',coll).eq('id',id).maybeSingle();if(error)throw err(error);return {id,exists:!!data,data:()=>data?data.data:undefined}},
    async set(d){
      const body=JSON.parse(JSON.stringify(d||{}));
      if(cache[coll]){cache[coll].set(id,body);emit(coll)}
      const {error}=await sb.from('docs').upsert({coll,id,data:body,updated_at:new Date().toISOString()});if(error)throw err(error);
    },
    async update(d){
      const body=JSON.parse(JSON.stringify(d||{}));
      if(cache[coll]){cache[coll].set(id,Object.assign({},cache[coll].get(id)||{},body));emit(coll)}
      const {error}=await sb.rpc('doc_merge',{p_coll:coll,p_id:id,p_patch:body});if(error)throw err(error);
    },
    async delete(){
      if(cache[coll]){cache[coll].delete(id);emit(coll)}
      const {error}=await sb.from('docs').delete().eq('coll',coll).eq('id',id);if(error)throw err(error);
    }
  };
}
function query(coll,filter,srv){
  return {
    onSnapshot(cb,onErr){
      (subs[coll]=subs[coll]||[]).push({cb,filter});
      if(!(coll in loaded)){loaded[coll]=srv||true;load(coll,srv).catch(e=>{onErr&&onErr(e)})}
      else if(cache[coll])setTimeout(()=>cb(snapOf(coll,filter)),0);
      realtime();
      return ()=>{subs[coll]=(subs[coll]||[]).filter(s=>s.cb!==cb)};
    },
    async get(){const m=await fetchColl(coll,srv);const docs=[];m.forEach((d,id)=>{if(!filter||filter(d))docs.push({id,data:()=>d})});return {docs}}
  };
}
const OPS={'>':(a,b)=>a>b,'>=':(a,b)=>a>=b,'<':(a,b)=>a<b,'<=':(a,b)=>a<=b,'==':(a,b)=>a===b,'!=':(a,b)=>a!==b};
const db={
  collection(coll){
    const q=query(coll,null,null);
    return Object.assign(q,{
      doc(id){return docRef(coll,id||rid())},
      async add(d){const r=docRef(coll,rid());await r.set(d);return r},
      where(f,op,v){
        const fn=OPS[op];const filter=d=>fn(d[f],v);
        const srvOp={'>':'gt','>=':'gte','<':'lt','<=':'lte','==':'eq','!=':'neq'}[op];
        // Para números (fechas en ms) el filtro de servidor compara texto: válido mientras tengan igual cantidad de dígitos.
        const srv=typeof v==='number'&&String(Math.trunc(v)).length===13&&srvOp?q2=>q2[srvOp]('data->>'+f,String(Math.trunc(v))):null;
        return query(coll,filter,srv);
      }
    });
  },
  doc(path){const p=path.split('/');return docRef(p[0],p[1])}
};

function planDraft(cid,m){const c=byId(S.clients,cid)||{};const sc=c.scope||{},as=c.assign||{};
  return{client:cid,month:m,spread:true,rows:Object.fromEntries(PIECES.map(([k])=>[k,{qty:+sc[k]||0,mode:k==='historia'?'grupo':'pieza',who:as[k]||''}]))}}
function openPlan(cid,m){S.planDraft=planDraft(cid||'',m||TODAY().slice(0,7));S.drawer={type:'plan'};S.confirm=null;render()}
function weekdays(m){const [y,mo]=m.split('-').map(Number);const out=[];const d=new Date(y,mo-1,1);const t=TODAY();
  while(d.getMonth()===mo-1){const x=iso(d);if(d.getDay()%6!==0&&x>=t)out.push(x);d.setDate(d.getDate()+1)}return out.length?out:[iso(new Date(y,mo,0))]}
function planCount(p){return PIECES.reduce((a,[k])=>{const r=p.rows[k];return a+(+r.qty>0?(r.mode==='pieza'?+r.qty:1):0)},0)}
function createPlan(p){
  const c=byId(S.clients,p.client);if(!c)return 0;const ds=weekdays(p.month);const mes=MESL[+p.month.slice(5)-1].toLowerCase();const items=[];let k=0;
  PIECES.forEach(([key,l])=>{const r=p.rows[key];const q=Math.max(0,Math.round(+r.qty||0));if(!q)return;
    if(r.mode==='pieza'){for(let i=1;i<=q;i++)items.push({id:'i'+(++k),type:key,qty:1,title:`${l} ${i}`,status:'pendiente',assignee:r.who||'',due:p.spread?ds[Math.min(ds.length-1,Math.floor((i-0.5)*ds.length/q))]:'',link:''})}
    else items.push({id:'i'+(++k),type:key,qty:q,title:`${q} ${PLP[key]}`,status:'pendiente',assignee:r.who||'',due:p.spread?ds[ds.length-1]:'',link:''})});
  if(!items.length)return 0;
  create('tasks',{title:`Plan ${mes} · ${c.name}`,desc:`Plan mensual de ${mes} según el alcance contratado.`,status:'pendiente',prio:'media',clientId:c.id,period:p.month,planId:`plan__${c.id}__${p.month}`,meetingId:'',type:'',qty:1,assignee:(c.assign||{}).ejecutiva||'',due:ds[ds.length-1],items,links:[],files:[],log:[]});
  return items.length;
}

const pend={},timers={},chains={};
function onWriteErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'&&S.canWrite===null){S.canWrite=false;document.body.classList.add('ro');render();toast('Tenés acceso de solo lectura en esta base.',1);return}
  if(code==='quota_exceeded'){toast('La base llegó a su límite de espacio. Borrá registros viejos para seguir cargando.',1);return}
  toast('No se pudo guardar el cambio. Revisá la conexión e intentá de nuevo.',1);
}
function chain(key,fn){chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(onWriteErr);return chains[key]}
function patch(coll,id,data,delay){
  if(!db){toast('Sin conexión a la base.',1);return}
  data=track(coll,id,data);
  const o=byId(S[coll],id);if(o)Object.assign(o,data);
  const key=coll+'/'+id;pend[key]=Object.assign(pend[key]||{},data);
  clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(key),delay||0);
}
function flush(key){const data=pend[key];delete pend[key];if(!data)return;chain(key,()=>db.doc(key).update(Object.assign({},data,{updatedAt:Date.now()})))}
async function create(coll,data){
  if(!db){toast('Sin conexión a la base.',1);return null}
  const ref=db.collection(coll).doc();const body=Object.assign({createdAt:Date.now(),updatedAt:Date.now()},data);const nt=trackCreate(coll,body);
  S[coll].push(Object.assign({id:ref.id},body));
  chain(coll+'/'+ref.id,()=>ref.set(body));if(nt)queueNotifs(coll,Object.assign({id:ref.id},body),nt,meKey(),body.createdAt);return ref.id;
}
function finPatch(cid,field,key,val){
  if(!db)return;const f=finOf(cid);const nf={fee:+f.fee||0,prices:Object.assign({},f.prices||{})};
  if(field==='fee')nf.fee=+val||0;else nf.prices[key]=+val||0;
  const i=S.fin.findIndex(x=>x.id===cid);const o=Object.assign({id:cid},nf);if(i<0)S.fin.push(o);else S.fin[i]=o;
  const k='finanzas/'+cid;clearTimeout(timers[k]);timers[k]=setTimeout(()=>chain(k,()=>db.doc(k).set(Object.assign({},nf,{updatedAt:Date.now()}))),600);
}
function avCostPatch(sid,val){if(!db)return;const o={cost:+val||0};const i=S.avCostos.findIndex(x=>x.id===sid);if(i<0)S.avCostos.push(Object.assign({id:sid},o));else S.avCostos[i]=Object.assign({id:sid},o);const k='avCostos/'+sid;clearTimeout(timers[k]);timers[k]=setTimeout(()=>chain(k,()=>db.doc(k).set(Object.assign({},o,{updatedAt:Date.now()}))),500)}
function remove(coll,id){S[coll]=S[coll].filter(x=>x.id!==id);chain(coll+'/'+id,()=>db.doc(coll+'/'+id).delete())}

}
function taskRow(x){

      <div class="qa" data-w>

function suggBlock(sg){

  <select class="in" id="sg-y-${i}" data-sg="${i}|tipo"><option value="">Sin tipo</option>${PIECES.map(([k,l])=>`<option value="${k}" ${s.tipo===k?'selected':''}>${l}${s.tipo===k&&s.qty>1?' ×'+s.qty:''}</option>`).join('')}</select>
  <select class="in" id="sg-r-${i}" data-sg="${i}|resp"><option value="">Responsable</option>${S.team.map(p=>`<option value="${p.id}" ${s.resp===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>

function linksBlock(coll,o){

/* ----- Tareas ----- */
function filtered(){
  const q=S.f.q.toLowerCase();
  return S.tasks.filter(x=>(!S.f.who||(S.f.who==='_none'?!x.assignee:mine(x,S.f.who)))&&(!S.f.client||(S.f.client==='_int'?!x.clientId:x.clientId===S.f.client))&&(!S.f.prio||x.prio===S.f.prio)&&(!q||(x.title||'').toLowerCase().includes(q)||(x.desc||'').toLowerCase().includes(q))&&dueF(x));
}
function dueF(x){const d=S.f.due;if(!d)return true;const t=TODAY();if(d==='rev')return x.status==='revision';if(!open(x)||!x.due)return false;if(d==='venc')return x.due<t;if(d==='hoy')return x.due===t;if(d==='sem')return x.due>t&&x.due<=addDays(t,7);return true}
const DUEL={venc:'Vencidas',hoy:'Vencen hoy',sem:'Próximos 7 días',rev:'Esperando revisión'};
function vTareas(){
  const ts=filtered();
  const tools=`<div class="tools">
    <input class="in" id="tq" data-f="q" placeholder="Buscar tarea" value="${esc(S.f.q)}" style="width:160px">
    <select class="in" id="fwho" data-f="who"><option value="">Todo el equipo</option>${S.team.map(p=>`<option value="${p.id}" ${S.f.who===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="_none" ${S.f.who==='_none'?'selected':''}>Sin asignar</option></select>
    <select class="in" id="fcl" data-f="client"><option value="">Todos los clientes</option>${S.clients.map(c=>`<option value="${c.id}" ${S.f.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="_int" ${S.f.client==='_int'?'selected':''}>Internas</option></select>
    <select class="in" id="fpr" data-f="prio"><option value="">Toda prioridad</option>${PRIO.map(([k,l])=>`<option value="${k}" ${S.f.prio===k?'selected':''}>${l}</option>`).join('')}</select>
    <div class="seg"><button class="${S.f.mode==='tablero'?'on':''}" data-act="mode" data-m="tablero">Tablero</button><button class="${S.f.mode==='lista'?'on':''}" data-act="mode" data-m="lista">Lista</button></div>
    <button class="btn" data-w data-act="plan-open">Plan mensual</button><button class="btn pri" data-w data-act="new-task">${I.plus}Tarea</button></div>`;
  let body;
  if(loading())body=`<div class="panel empty">Cargando tareas…</div>`;
  else if(!S.tasks.length)body=`<div class="panel empty"><b>Todavía no hay tareas</b>Creálas desde una reunión para que queden vinculadas, o cargá una suelta.<button class="btn pri" data-w data-act="new-task">${I.plus}Crear tarea</button></div>`;
  else if(S.f.mode==='tablero'){
    body=`<div class="board">${STATUS.map(([k,l])=>{const col=sortTasks(ts.filter(x=>(x.status||'pendiente')===k));return `<div class="col" data-drop="${k}"><h4><span class="st st-${k}">${l}</span><span class="mono">${col.length}</span></h4>${col.map(card).join('')||`<div class="hint" style="padding:6px 2px">Sin tareas</div>`}</div>`}).join('')}</div>`;
  }else{
    const list=sortTasks(ts);
    body=`<section class="panel tlist"><div class="hdr"><span style="flex:1">Tarea</span><span class="cell hide">Cliente</span><span class="cell" style="width:100px">Estado</span><span class="cell" style="width:120px">Vence</span></div><div class="rows">${list.map(x=>{const di=dueInfo(x);return `<div class="row" data-act="open-task" data-id="${x.id}"><span class="pri-m pri-${x.prio||'media'}"></span>${av(x.assignee)}<div class="main"><div class="ttl">${esc(x.title||'Tarea sin título')} ${ptag(x)} ${xt(x)}</div>${x.meetingId&&byId(S.meetings,x.meetingId)?`<div class="sub">De: ${esc(byId(S.meetings,x.meetingId).title||'reunión')}</div>`:''}</div><span class="cell hide">${cchip(x.clientId)||'<span class="hint">Interna</span>'}</span><span class="cell" style="width:100px"><span class="st st-${x.status||'pendiente'}">${STL[x.status||'pendiente']}</span></span><span class="cell" style="width:120px">${di?`<span class="due ${di.cls}">${di.txt}</span>`:'<span class="hint">—</span>'}</span></div>`}).join('')||'<div class="empty">Ninguna tarea coincide con los filtros.</div>'}</div></section>`;
  }
  const od=ts.filter(x=>open(x)&&x.due&&x.due<TODAY()).length;
  return `<div class="head"><div class="grow"><h1>Tareas</h1><p>${ts.filter(open).length} abiertas${od?` · <span style="color:var(--bad)">${od} vencidas</span>`:''}${S.f.due?` · <span class="chip" style="--h:340">${DUEL[S.f.due]}</span>`:''}${S.f.who||S.f.client||S.f.prio||S.f.q||S.f.due?` · <button class="btn ghost" style="padding:2px 6px" data-act="clear-f">Quitar filtros</button>`:''}</p></div>${tools}</div>${body}`;

function card(x){
  const di=dueInfo(x);const nl=(x.links||[]).length+(x.files||[]).length;
  return `<div class="card" draggable="${S.canWrite!==false}" data-drag="${x.id}" data-act="open-task" data-id="${x.id}"><div class="ttl">${esc(x.title||'Tarea sin título')}</div>

/* ----- Alcance ----- */
function meter(used,cap){
  if(!cap&&!used)return '<span class="na">—</span>';
  const over=used>cap,cls=over?'over':(cap&&used>=cap*.8?'warn':'');
  return `<div class="meter"><span class="v ${cls}">${used}<span class="muted">/${cap}</span>${over?` <span style="font-size:11px">+${used-cap}</span>`:''}</span><div class="bar"><i class="${cls}" style="width:${cap?Math.min(100,used/cap*100):100}%"></i></div></div>`;
}
function vAlcance(){
  const p=S.month,own=S.isOwner;const sc=scope();
  const withS=S.clients.filter(hasScope).sort((a,b)=>(a.group||a.name).localeCompare(b.group||b.name)||a.name.localeCompare(b.name));
  const noS=S.clients.filter(c=>!hasScope(c)&&c.active!==false);
  let tc=0,ta=0,tcl=0;
  const rows=withS.map(c=>{
    const bk=sc.cp[c.id+'|'+p]||{};const m=clientMonth(c.id,p);tc+=m.count;ta+=m.amount;if(m.count)tcl++;
    const on=S.xopen===c.id;
    const head=`<tr class="cl ${on?'on':''}" data-act="xopen" data-id="${c.id}"><td class="nm">${esc(c.name)}${c.group?`<span class="sub">${esc(c.group)}</span>`:''}</td>${PIECES.map(([k])=>`<td>${meter(bk[k]?bk[k].used:0,+(c.scope||{})[k]||0)}</td>`).join('')}<td>${m.count?`<span class="xtag">${m.count} extra${m.count>1?'s':''}</span>`:m.items.length?'<span class="xtag bon">Bonificado</span>':'<span class="na">—</span>'}</td>${own?`<td class="money">${m.amount?gs(m.amount):'<span class="na">—</span>'}</td>`:''}<td>${planTasks(c.id,p).length?`<button class="btn ghost" data-act="open-task" data-id="${planTasks(c.id,p)[0].id}" style="padding:3px 8px">✓ ${(()=>{const pt=planTasks(c.id,p);const it=pt.flatMap(t=>t.items||[]);return it.length?it.filter(i=>i.status==='hecha').length+'/'+it.length+' piezas':pt.length+' tareas'})()}</button>`:`<button class="btn" data-w data-act="plan-open" data-id="${c.id}" data-m="${p}" style="padding:3px 8px">Generar plan</button>`}</td></tr>`;
    if(!on)return head;
    const fee=finOf(c.id).fee;

const IT_ST=[['por_cotizar','Por cotizar'],['estimado','Estimado'],['referencia','Referencia'],['cotizado','Cotizado'],['confirmado','Confirmado'],['incluido','Incluido'],['aporte','Aporte del cliente']];

const SOFT=['por_cotizar','estimado','referencia'],FREE=['incluido','aporte'];

const itTotal=i=>(+i.qty||0)*(+i.price||0);

const nf=n=>Math.round(Number(n)||0).toLocaleString('es-PY');
function evCalc(e){
  const its=S.items.filter(i=>i.eventId===e.id);
  const base=its.filter(counts);const sub=base.reduce((a,i)=>a+itTotal(i),0);
  const cont=sub*(+e.cont||0)/100,fee=sub*(+e.fee||0)/100,pre=sub+cont+fee,iva=pre*(+e.iva||0)/100,total=pre+iva;
  const opt=its.filter(i=>i.optional).reduce((a,i)=>a+itTotal(i),0);
  const wc=base.filter(i=>+costOf(i.id).cost>0);
  const cost=wc.reduce((a,i)=>a+(+costOf(i.id).cost),0);
  const util=wc.reduce((a,i)=>a+itTotal(i)-(+costOf(i.id).cost),0);
  const noCost=base.filter(i=>itTotal(i)>0&&!(+costOf(i.id).cost));
  const soft=base.filter(i=>SOFT.includes(i.status||'por_cotizar'));
  const noPrice=base.filter(i=>!itTotal(i)&&!FREE.includes(i.status));
  const noSup=base.filter(i=>itTotal(i)>0&&!i.supplier&&!FREE.includes(i.status));
  const paid=base.reduce((a,i)=>a+(+costOf(i.id).paid||0),0);
  const owe=wc.filter(i=>(+costOf(i.id).paid||0)<(+costOf(i.id).cost));
  return{its,base,sub,cont,fee,pre,iva,total,opt,cost,util,noCost,soft,noPrice,noSup,paid,owe,gain:util+fee,pend:soft.length+noPrice.length};
}

function postPatch(meta,field,val){
  if(!db)return;const [id,ctid,m,type,n]=meta;const ct=byId(S.contrataciones,ctid);const po=postOf(id);
  const o={contratId:ctid,campaignId:ct?ct.campaignId:'',month:m,type,n:+n,status:po.status||'pendiente',date:po.date||'',link:po.link||'',reach:+po.reach||0,views:+po.views||0,inter:+po.inter||0,clicks:+po.clicks||0};
  o[field]=['reach','views','inter','clicks'].includes(field)?(+val||0):val;
  if(field==='link'&&val&&o.status!=='posteado'){o.status='posteado';if(!o.date)o.date=TODAY()}
  if(field==='status'&&val==='posteado'&&!o.date)o.date=TODAY();
  const k=S.posteos.findIndex(x=>x.id===id);const lo=Object.assign({id},o);if(k<0)S.posteos.push(lo);else S.posteos[k]=lo;
  const key='posteos/'+id;clearTimeout(timers[key]);timers[key]=setTimeout(()=>chain(key,()=>db.doc(key).set(Object.assign({},o,{updatedAt:Date.now()}))),500);
}

}

const COB=[['por_facturar','Por facturar'],['facturado','Facturado'],['cobrado','Cobrado']];
const COBL=Object.fromEntries(COB);
function incomeLines(m){
  const L=[];
  S.clients.forEach(c=>{if(c.active===false)return;const f=+finOf(c.id).fee||0;if(f)L.push({id:`fee__${c.id}__${m}`,kind:'Fee mensual',clientId:c.id,concept:'Fee de '+MESL[+m.slice(5)-1].toLowerCase(),amount:f});
    const x=clientMonth(c.id,m);if(x.amount)L.push({id:`ext__${c.id}__${m}`,kind:'Extras de alcance',clientId:c.id,concept:`${x.count} pieza${x.count>1?'s':''} fuera de alcance`,amount:x.amount})});
  S.campanas.forEach(cp=>{if(!(cp.months||[]).includes(m))return;const a=S.contrataciones.filter(x=>x.campaignId===cp.id).reduce((s,x)=>s+(+x.price||0),0);if(a)L.push({id:`inf__${cp.id}__${m}`,kind:'Influencers',clientId:cp.clientId,concept:cp.name,amount:a})});
  S.eventos.forEach(e=>{if((e.status||'propuesta')==='propuesta')return;const em=e.billMonth||(e.date||'').slice(0,7);if(em!==m)return;L.push({id:`ev__${e.id}`,kind:'Evento',clientId:e.clientId,concept:e.name||'Evento',amount:evCalc(e).total})});
  avExtrasIncome(m).forEach(x=>{if(x.amount)L.push({id:`avx__${x.cid}__${m}`,kind:'Extras audiovisual',clientId:x.cid,concept:`${x.n} reel${x.n>1?'s':''} extra de audiovisual`,amount:x.amount})});
  S.cobros.filter(x=>x.manual&&x.month===m).forEach(x=>L.push({id:x.id,kind:'Otro ingreso',clientId:x.clientId,concept:x.concept,amount:+x.amount||0,manual:true}));
  return L.map(l=>{const st=byId(S.cobros,l.id)||{};return Object.assign(l,{st,status:st.status||'por_facturar'})});
}
function expenseLines(m){
  const L=[];
  S.team.forEach(p=>{const n=byId(S.nomina,p.id);if(n&&+n.amount)L.push({id:`nom__${p.id}__${m}`,kind:'Equipo',concept:p.name,detail:p.role||'',amount:+n.amount})});
  S.contrataciones.forEach(ct=>{const cp=byId(S.campanas,ct.campaignId);if(!cp||!(cp.months||[]).includes(m))return;const ci=ciOf(ct.id);if(!+ci.cost)return;L.push({id:`infp__${ct.id}__${m}`,kind:'Influencers',concept:infName(ct.influencerId),detail:cp.name,amount:+ci.cost,inf:{ct:ct.id,m},status:((ci.pays||{})[m]||{}).status==='pagado'?'pagado':'pendiente'})});
  S.eventos.forEach(e=>{if((e.status||'propuesta')==='propuesta'||(e.date||'').slice(0,7)!==m)return;const g={};evCalc(e).base.forEach(i=>{const co=costOf(i.id);if(!+co.cost)return;const k=i.supplier||'Sin proveedor';g[k]=g[k]||{cost:0,paid:0};g[k].cost+=+co.cost;g[k].paid+=+co.paid||0});
    Object.entries(g).forEach(([k,v])=>L.push({id:`evp__${e.id}__${k}`,kind:'Proveedores de eventos',concept:k,detail:e.name,amount:v.cost,paid:v.paid,ev:e.id,status:v.paid>=v.cost?'pagado':'pendiente'}))});
  {const g={};avCostLines(m).forEach(l=>{const k=l.prov||'_';g[k]=g[k]||{a:0,n:0};g[k].a+=l.amount;g[k].n+=l.qty});Object.entries(g).forEach(([p,v])=>{if(v.a)L.push({id:`av__${p}__${m}`,kind:'Audiovisual',concept:provName(p),detail:`${v.n} servicio${v.n>1?'s':''} del mes`,amount:v.a})})}
  S.pagos.filter(x=>x.manual&&x.month===m).forEach(x=>L.push({id:x.id,kind:x.category||'Otro gasto',concept:x.concept,detail:'',amount:+x.amount||0,manual:true}));
  return L.map(l=>{if(l.inf||l.ev)return l;const st=byId(S.pagos,l.id)||{};return Object.assign(l,{st,status:st.status||'pendiente'})});
}
function admPatch(coll,id,data){
  if(!db)return;const cur=byId(S[coll],id)||{};const o=Object.assign({},cur,data);delete o.id;
  const k=S[coll].findIndex(x=>x.id===id);const lo=Object.assign({id},o);if(k<0)S[coll].push(lo);else S[coll][k]=lo;
  const key=coll+'/'+id;clearTimeout(timers[key]);timers[key]=setTimeout(()=>chain(key,()=>db.doc(key).set(Object.assign({},o,{updatedAt:Date.now()}))),400);
}

async function suggest(mid){
  const m=byId(S.meetings,mid);if(!m)return;
  Object.keys(pend).forEach(flush);
  if(!(m.notes||'').trim()){toast('Escribí primero la minuta de la reunión.',1);return}
  S.sugg={meetingId:mid,loading:true,items:[]};render();
  const t=TODAY();const d=pd(t);
  const team=S.team.map(p=>`${p.id}: ${p.name}${p.role?' — '+p.role:''}`).join('\n')||'(sin equipo cargado)';
  const cl=byId(S.clients,m.clientId);
  const prompt=`Sos el asistente operativo de una agencia de marketing en Paraguay. A partir de la minuta de una reunión, extraé las tareas accionables que quedaron pendientes.
Hoy es ${['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]} ${t}. Fecha de la reunión: ${m.date||t}. Cliente: ${cl?cl.name:'interna'}.
Equipo (id: nombre — rol):
${team}

Reglas:
- Solo tareas que surgen de la minuta; no inventes.
- Título corto que empiece con un verbo en infinitivo (ej. "Enviar propuesta de pauta").
- responsable_id: el id del equipo si la minuta nombra a la persona o es obvio por su rol; si no, null.
- vence: fecha YYYY-MM-DD si la minuta da un plazo ("el viernes", "antes del 30"); si no, null.
- prioridad: "alta", "media" o "baja".
- tipo: si la tarea produce una pieza para el cliente, uno de "post", "historia", "reel", "carrusel", "diseno" (diseño institucional o comercial), "cobertura"; si no, null.
- cantidad: cuántas piezas de ese tipo (número, por defecto 1).
Respondé SOLO con un array JSON, ejemplo: [{"titulo":"Editar reels de la cobertura","responsable_id":null,"vence":"2026-10-24","prioridad":"alta","tipo":"reel","cantidad":4}]

Minuta:
${m.notes}`;
  try{
    const r=await sample.json(prompt,{modelTier:'default'});
    const ok=Array.isArray(r)?r:[];
    S.sugg={meetingId:mid,items:ok.filter(x=>x&&x.titulo).slice(0,15).map(x=>({sel:true,titulo:String(x.titulo).slice(0,200),resp:byId(S.team,x.responsable_id)?x.responsable_id:'',vence:/^\d{4}-\d{2}-\d{2}$/.test(x.vence||'')?x.vence:'',prio:['alta','media','baja'].includes(x.prioridad)?x.prioridad:'media',tipo:PL[x.tipo]?x.tipo:'',qty:Math.max(1,Math.min(50,Math.round(+x.cantidad||1)))}))};
  }catch(e){

  }
  render();
}

    case 'plan-open':openPlan(id||(S.f.client&&S.f.client!=='_int'?S.f.client:''),el.dataset.m||S.month||TODAY().slice(0,7));break;
    case 'plan-create':{const n=createPlan(S.planDraft);S.drawer=null;render();if(n)toast(`Plan creado con ${n} piezas`);break}
    case 'plan-see':S.f.client=id;S.f.who='';S.f.prio='';S.f.q='';S.f.due='';S.f.mode='lista';saveF();S.drawer=null;go('tareas');break;
    case 'plan-all':{const m=S.month;let tot=0;S.clients.filter(c=>c.active!==false&&hasScope(c)&&!planTasks(c.id,m).length).forEach(c=>{tot+=createPlan(planDraft(c.id,m))});S.confirm=null;render();toast(tot?`Planes creados (${tot} piezas) para ${fmonth(m).toLowerCase()}`:'Todos los clientes ya tienen su plan');break}
    case 'adm-month':S.admMonth=shiftM(S.admMonth||TODAY().slice(0,7),+el.dataset.n);render();break;
    case 'adm-tab':S.admTab=el.dataset.t;render();break;
    case 'adm-goto':S.admMonth=el.dataset.m;S.admTab='cob';render();break;
    case 'adm-ev':S.ev=id;S.evTab='pagos';go('eventos');break;
    case 'add-cob':{const c=document.getElementById('nc-concept').value.trim(),a=+document.getElementById('nc-amount').value;if(!c||!a){toast('Completá concepto y monto.',1);return}const nid='man-'+Date.now().toString(36);admPatch('cobros',nid,{manual:true,concept:c,clientId:document.getElementById('nc-client').value,amount:a,month:S.admMonth,status:'por_facturar'});render();break}
    case 'add-pag':{const c=document.getElementById('np-concept').value.trim(),a=+document.getElementById('np-amount').value;if(!c||!a){toast('Completá concepto y monto.',1);return}const nid='man-'+Date.now().toString(36);admPatch('pagos',nid,{manual:true,concept:c,category:document.getElementById('np-cat').value,amount:a,month:S.admMonth,status:'pendiente'});render();break}
    case 'del-adm':remove(el.dataset.c,id);render();break;
    case 'new-camp':{const t=TODAY().slice(0,7);create('campanas',{name:'Campaña nueva',clientId:'',months:[t,shiftM(t,1),shiftM(t,2)],status:'activa',notes:''}).then(id=>{if(id){S.camp=id;S.infMonth=t;S.infTab='seg';if(S.view!=='influencers')S.view='influencers';render()}});break}
    case 'new-ct':{const c=curCamp();if(!c)break;create('influencers',{name:'',ig:'',followers:'',zone:'',contact:'',notes:''}).then(iid=>{if(!iid)return;create('contrataciones',{campaignId:c.id,influencerId:iid,plan:{post:0,reel:1,tiktok:0,historia:2},price:0,code:'',contract:'',contractLink:'',prod:'',notes:''}).then(cid=>{if(cid){S.drawer={type:'ct',id:cid};S.ctMonth=null;render();setTimeout(()=>{const x=document.getElementById('f-name');x&&x.focus()},30)}})});break}
    case 'open-ct':S.drawer={type:'ct',id};S.ctMonth=null;S.confirm=null;render();break;
    case 'inf-month':S.infMonth=el.dataset.m;render();break;
    case 'inf-tab':S.infTab=el.dataset.t;render();break;
    case 'ct-month':S.ctMonth=el.dataset.m;render();break;
    case 'copy-rep':{const txt=repTable().map(r=>r.join('\t')).join('\n');navigator.clipboard.writeText(txt).then(()=>toast('Reporte copiado. Pegalo en Excel o Google Sheets.'),()=>toast('No se pudo copiar desde esta vista. Usá Descargar CSV.',1));break}
    case 'dl-rep':{const c=curCamp();downloads.save({filename:`Reporte influencers ${(c.name||'').replace(/[\\/:*?"<>|]/g,'')} ${fmonth(curMonth(c))}.csv`,data:csvOf(repTable())}).catch(err=>{if(err&&err.code!=='declined')toast('No se pudo descargar. Usá Copiar para Excel.',1)});break}
    case 'new-event':create('eventos',{name:'',clientId:'',date:'',place:'',concept:'',guests:0,attendance:0,hosp:0,tc:6000,fee:15,cont:10,iva:10,markup:30,status:'propuesta',sections:DEF_SECS.slice(),notes:''}).then(id=>{if(id){S.ev=id;S.evTab='ppto';if(S.view!=='eventos')S.view='eventos';render();setTimeout(()=>{const x=document.getElementById('ev-name');x&&x.focus()},30)}});break;
    case 'open-event':S.ev=id;S.evTab='ppto';S.confirm=null;if(S.view!=='eventos')go('eventos');else{render();window.scrollTo(0,0)}break;
    case 'ev-back':S.ev=null;S.confirm=null;render();break;
    case 'ev-tab':S.evTab=el.dataset.t;render();break;
    case 'new-item':{const e=byId(S.eventos,S.ev);if(!e)break;create('items',{eventId:e.id,sec:el.dataset.sec,code:nextCode(e.id),name:'',scope:'',qty:1,unit:'unidad',price:0,status:'por_cotizar',supplier:'',owner:'',optional:false,alt:'',pick:true,notes:'',ord:Date.now()}).then(iid=>{if(iid){S.drawer={type:'item',id:iid};render();setTimeout(()=>{const x=document.getElementById('i-name');x&&x.focus()},30)}});break}
    case 'open-item':S.drawer={type:'item',id};S.confirm=null;render();break;
    case 'add-sec':{const inp=document.getElementById('new-sec');const v=(inp.value||'').trim();if(!v)return;const e=byId(S.eventos,id);patch('eventos',id,{sections:secsOf(e).concat([v])});inp.value='';render();break}
    case 'del-event':{S.items.filter(i=>i.eventId===id).forEach(i=>{remove('items',i.id);if(byId(S.costos,i.id))chain('costos/'+i.id,()=>db.doc('costos/'+i.id).delete())});remove('eventos',id);S.ev=null;S.confirm=null;render();toast('Evento borrado');break}
    case 'calc-price':{const it=byId(S.items,id),e=byId(S.eventos,it.eventId),co=costOf(id);if(!+co.cost)break;patch('items',id,{price:Math.ceil((+co.cost)*(1+(+e.markup||0)/100)/Math.max(1,+it.qty||1)/1000)*1000});render();break}
    case 'copy-client':{const e=byId(S.eventos,id);const txt=clientTable(e).map(r=>r.join('\t')).join('\n');navigator.clipboard.writeText(txt).then(()=>toast('Copiado. Pegalo en Excel o Google Sheets.'),()=>toast('No se pudo copiar desde esta vista. Usá Descargar CSV.',1));break}
    case 'dl-client':exportCSV(byId(S.eventos,id));break;
    case 'xopen':S.xopen=S.xopen===id?null:id;render();break;
    case 'month':S.month=shiftM(S.month,+el.dataset.n);S.xopen=null;render();break;
    case 'mode':S.f.mode=el.dataset.m;saveF();render();break;
    case 'clear-f':S.f.due='';S.f.who='';S.f.client='';S.f.prio='';S.f.q='';saveF();render();break;
    case 'suggest':suggest(id);break;
    case 'sugg-toggle':{const s=S.sugg.items[+el.dataset.i];s.sel=!s.sel;render();break}
    case 'sugg-close':S.sugg=null;render();break;
    case 'sugg-create':suggCreate();break;
  }
});
function bindVal(el){
  const [coll,id,field]=el.dataset.bind.split('|');let v=el.value;
  if(field==='active'||field==='optional'||field==='pick')v=v==='true';
  if(coll==='tasks'&&field==='status'){setStatus(id,v);return}
  if(coll==='videos'&&field==='status'){vidStatus(id,v);return}
  patch(coll,id,{[field]:v},+(el.dataset.delay||0)||(el.tagName==='INPUT'&&el.type==='text'||el.tagName==='TEXTAREA'||!el.type?600:0));
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.bind&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['date','time'].includes(el.type)))){
    const [coll,id,field]=el.dataset.bind.split('|');patch(coll,id,{[field]:el.value},+(el.dataset.delay||600));
    if(field==='title'||field==='name'||['qty','rounds','period','price','markup','fee','cont','iva','tc','code'].includes(field))renderNavSoft();
  }
  if(el.dataset.f&&el.tagName==='INPUT'){S.f[el.dataset.f]=el.value;saveF();render()}
  if(el.id==='log-in')mnUpdate(el);
  if(el.dataset.sg&&el.tagName==='INPUT'&&el.type!=='date'){const [i,k]=el.dataset.sg.split('|');S.sugg.items[+i][k]=el.value}
});
let softT;function renderNavSoft(){clearTimeout(softT);softT=setTimeout(()=>{/* refresh list titles without stealing focus */render()},700)}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.bind&&(el.tagName==='SELECT'||['date','time'].includes(el.type))){bindVal(el);const [c,i,fl]=el.dataset.bind.split('|');if(c==='tasks'&&(fl==='type'||fl==='clientId'))autoAssign(i);render()}
  if(el.dataset.scope){const [cid,k]=el.dataset.scope.split('|');const c=byId(S.clients,cid);patch('clients',cid,{scope:Object.assign({},c.scope||{},{[k]:el.value===''?0:Math.max(0,Math.round(+el.value))})});render()}
  if(el.dataset.corr){patch('clients',el.dataset.corr,{corr:el.value===''?null:+el.value});render()}
  if(el.dataset.assign){const [cid,k]=el.dataset.assign.split('|');const c=byId(S.clients,cid);patch('clients',cid,{assign:Object.assign({},c.assign||{},{[k]:el.value})});render()}
  if(el.dataset.pl&&S.planDraft){const [k,f]=el.dataset.pl.split('|');const p=S.planDraft;if(k==='_'){if(f==='client'||f==='month'){S.planDraft=planDraft(f==='client'?el.value:p.client,f==='month'?(el.value||p.month):p.month);S.planDraft.spread=p.spread}else p.spread=el.value==='1'}else p.rows[k][f]=f==='qty'?Math.max(0,Math.round(+el.value||0)):el.value;render()}
  if(el.dataset.cob){const [id,f]=el.dataset.cob.split('|');const d={[f]:el.value};if(f==='status'&&el.value==='facturado'&&!(byId(S.cobros,id)||{}).invDate)d.invDate=TODAY();if(f==='status'&&el.value==='cobrado'&&!(byId(S.cobros,id)||{}).paidDate)d.paidDate=TODAY();admPatch('cobros',id,d);if(f!=='invoice')render()}
  if(el.dataset.pag){const [id,f]=el.dataset.pag.split('|');admPatch('pagos',id,{[f]:el.value,date:el.value==='pagado'?TODAY():''});render()}
  if(el.dataset.nom){admPatch('nomina',el.dataset.nom,{amount:+el.value||0});render()}
  if(el.dataset.ui==='camp'){S.camp=el.value;S.infMonth=null;render()}
  if(el.dataset.plan){const [cid,k]=el.dataset.plan.split('|');const ct=byId(S.contrataciones,cid);patch('contrataciones',cid,{plan:Object.assign({},ct.plan||{},{[k]:Math.max(0,Math.round(+el.value||0))})});render()}
  if(el.dataset.post){const a=el.dataset.post.split('|');postPatch(a.slice(0,5),a[5],el.value);if(el.tagName==='SELECT'||el.type==='date'||a[5]==='link')render()}
  if(el.dataset.ci){const [cid,k]=el.dataset.ci.split('|');ciPatch(cid,k,el.value);render()}
  if(el.dataset.pay){const [cid,m]=el.dataset.pay.split('|');ciPatch(cid,'pay',el.value,m);render()}
  if(el.dataset.viewas){S.viewAs=el.value||null;applyPerms();S.drawer=null;const al=allowedViews();if(!al.includes(S.view))S.view=al[0];render();window.scrollTo(0,0)}
  if(el.dataset.ms){const [k,key]=el.dataset.ms.split('|');if(k==='item'){const [tid,iid]=key.split('#');itemPatch(tid,iid,{status:el.value})}else if(k==='video')vidStatus(key,el.value);else setStatus(key,el.value);render()}
  if(el.dataset.avc){const [cid,k]=el.dataset.avc.split('|');avcPatch(cid,k,el.value);render()}
  if(el.dataset.avf){(S.avF=S.avF||{c:'',st:'abiertos',per:'mes'})[el.dataset.avf]=el.value;render()}
  if(el.dataset.avcost){avCostPatch(el.dataset.avcost,el.value);render()}
  if(el.dataset.sq){const [coll,oid,sid]=el.dataset.sq.split('|');const o=byId(S[coll],oid);if(o){patch(coll,oid,{servs:(o.servs||[]).map(x=>x.id===sid?{id:sid,qty:Math.max(1,Math.round(+el.value||1))}:x)});render()}}
  if(el.dataset.itemf){const [tid,iid,f]=el.dataset.itemf.split('|');itemPatch(tid,iid,{[f]:el.value});render()}
  if(el.dataset.cost){const [iid,k]=el.dataset.cost.split('|');costPatch(iid,k,el.value);render()}
  if(el.dataset.fin){const [cid,k]=el.dataset.fin.split('|');finPatch(cid,k==='fee'?'fee':'price',k,el.value);render()}
  if(el.dataset.f&&el.tagName==='SELECT'){S.f[el.dataset.f]=el.value;saveF();render()}
  if(el.dataset.sg&&(el.tagName==='SELECT'||el.type==='date')){const [i,k]=el.dataset.sg.split('|');S.sugg.items[+i][k]=el.value}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='qa-title'){e.preventDefault();qaAdd(e.target.dataset.qa)}
  if(e.target.id==='log-in'){const bx=document.getElementById('mn-box');if(bx&&!bx.hidden){if(e.key==='Escape'){bx.hidden=true;e.stopPropagation();return}if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();const f=bx.querySelector('[data-act="mn-pick"]');f&&mnPick(f.dataset.n);return}}}
  if(e.key==='Enter'&&e.target.id==='log-in'){e.preventDefault();const b=document.querySelector('[data-act="add-log"]');b&&b.click()}
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ln-u-')){e.preventDefault();const b=e.target.parentElement.querySelector('[data-act="add-link"]');b&&b.click()}
  if(e.key==='Escape'&&S.drawer){Object.keys(pend).forEach(flush);S.drawer=null;S.confirm=null;render()}
});
/* drag & drop on board */
let dragId=null,dragMoved=false;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;dragId=c.dataset.drag;dragMoved=true;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}});
document.addEventListener('dragend',()=>{dragId=null;setTimeout(()=>dragMoved=false,50);document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col||!dragId)return;e.preventDefault();const t=byId(S.tasks,dragId);if(t&&t.status!==col.dataset.drop){setStatus(dragId,col.dataset.drop)}dragId=null;render()});

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude||!window.claude.use){S.status='offline';render();return}
  const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!d){S.status='offline';render();return}
  db=d;user=u;
  if(u){S.me.uid=await u.id();S.realOwner=await u.isOwner();S.realAdm=!S.realOwner&&await u.canEdit();applyPerms();const cw=await u.can('data.write');S.canWrite=cw===null?null:cw;if(cw===false)document.body.classList.add('ro')}else S.canWrite=null;
  ['clients','team','meetings','tasks','finanzas','eventos','items','costos','influencers','campanas','contrataciones','posteos','costosInf','cobros','pagos','nomina','videos','avProv','avServ','avCostos','avShoots'].forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const key=c==='finanzas'?'fin':c;
      S[key]=snap.docs.map(x=>{const o=Object.assign({id:x.id},x.data());const p=pend[c+'/'+x.id];return p?Object.assign(o,p):o});
      if(c==='clients')S.clients.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      if(!['clients','team','meetings','tasks'].includes(c)){render();return}
      S.loaded[c]=true;S.status='live';render();
    },err=>{if(err&&err.code==='revoked'){S.status='offline';render()}else toast('Se cortó la conexión con la base. Recargá la página.',1)});
  });
  db.collection('notifs').where('at','>',Date.now()-45*864e5).onSnapshot(snap=>{S.notifs=snap.docs.map(x=>{const o=Object.assign({id:x.id},x.data());const p=pend['notifs/'+x.id];return p?Object.assign(o,p):o});renderNav();if(S.drawer&&S.drawer.type==='notifs')renderDrawer()},()=>{});
  window.claude.use('assets').then(a=>{assets=a;if(a)render()});
  loadMembers();
  window.claude.use('downloads').then(x=>{downloads=x;if(x)render()});
})();
})();
</script>
